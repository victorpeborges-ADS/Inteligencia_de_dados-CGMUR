# Reverse proxy — Fase 4.5
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.proxy.yml up -d
#
# Acesso único: http://localhost (porta 80)
# API: http://localhost/api/v1/...
# Configure PUBLIC_BASE_URL, CORS_ORIGINS e OIDC_REDIRECT_URI para a URL pública.

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: sinidu_proxy
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  backend:
    environment:
      - TRUST_PROXY_HEADERS=true
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-http://localhost/api/v1/auth/oidc/callback}
      - OIDC_FRONTEND_REDIRECT=${OIDC_FRONTEND_REDIRECT:-http://localhost/}

  frontend:
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost}
