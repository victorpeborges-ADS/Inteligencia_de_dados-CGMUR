version: '3.8'

services:
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: sinidu_db
    environment:
      - POSTGRES_USER=sinidu_user
      - POSTGRES_PASSWORD=sinidu_pass
      - POSTGRES_DB=sinidu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinidu_user -d sinidu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: sinidu_ollama
    volumes:
      - ./ollama_data:/root/.ollama
      - ./docker/ollama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "11434:11434"
    mem_limit: 12g
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sinidu_backend
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://sinidu_user:sinidu_pass@db:5432/sinidu_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - REPORTS_DIR=/data/reports
      - MODELS_DIR=/data/models
      - ML_DATA_DIR=/data/ml
      - DEM_DIR=/data/dem
      - LOCAL_DEM_DIR=/data/dem/local
      - TILES3D_DIR=/data/3dtiles
      - CITYMODEL_DIR=/data/citymodels
      - MAPBIOMAS_STATS_DIR=/data/mapbiomas
      - INMET_BDMEP_DIR=/data/inmet_bdmep
      - MERGE_CPTEC_DIR=/data/merge_cptec
      - CEMADEN_PLUVIO_DIR=/data/cemaden_pluvio
      - ANA_FLUVIO_DIR=/data/ana_hidroweb
      # 20h.4 / 20h.5 — overrides oficiais (também cobertos pelo bind ./backend:/app)
      - IDF_DIR=/app/data/idf
      - OFFICIAL_FLOOD_DIR=/app/data/manchas_oficiais
      - REFINE_PILOT_DEM=true
      - BOOT_PRIORITY_IBGE_CODES=2611606,2800308
      - SEED_DEMO_MUNICIPALITIES=false
      - JOB_STORE_REDIS=true
      - OPENTOPOGRAPHY_API_KEY=${OPENTOPOGRAPHY_API_KEY:-}
      - OSRM_URL=http://osrm:5000
      - OSRM_REGION=${OSRM_REGION:-pe-se}
      - OSRM_COVERED_UFS=${OSRM_COVERED_UFS:-PE,SE}
      - GOTIFY_URL=http://gotify:80
      - GOTIFY_TOKEN=
      - AI_CHAT_PROVIDER=${AI_CHAT_PROVIDER:-mistral}
      - AI_EMBED_PROVIDER=${AI_EMBED_PROVIDER:-mistral}
      - AI_ALLOWED_PROVIDERS=${AI_ALLOWED_PROVIDERS:-mistral}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_CHAT_MODEL=${MISTRAL_CHAT_MODEL:-mistral-small-latest}
      - MISTRAL_EMBED_MODEL=${MISTRAL_EMBED_MODEL:-mistral-embed}
      - RAG_EMBEDDING_DIM=1024
      - AUTH_ENABLED=false
      # Dev: secret default OK (boot avisa). Dev Tunnel / LAN pública → AUTH_ENABLED=true + secret >=32.
      - AUTH_JWT_SECRET=sinidu-dev-secret-trocar-em-producao
      - CORS_ORIGINS=http://localhost:3000
      - BACKUP_DIR=/data/backups
      - BACKUP_RETENTION_DAYS=7
      - LOG_FORMAT=json
      - SIMULATION_CACHE_ENABLED=true
      - SIMULATION_CACHE_TTL=86400
      - SIMULATION_INTERPRET_CACHE_ENABLED=true
      - SIMULATION_INTERPRET_CACHE_TTL=21600
      # Produção: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
      # Mapa satélite Google no PDF (Static Maps API — opcional):
      # - GOOGLE_MAPS_API_KEY=
      # - OPENAI_API_KEY=
      # - OPENAI_CHAT_MODEL=gpt-4o-mini
      # - ANTHROPIC_API_KEY=
      # - GEMINI_API_KEY=
      # - GEMINI_CHAT_MODEL=gemini-2.0-flash
      # - GROQ_API_KEY=
      # - OPENROUTER_API_KEY=
      # Mistral: defina MISTRAL_API_KEY no .env (não versionar a chave)
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./documentacao:/app/documentacao:ro
      - reports_data:/data/reports
      - models_data:/data/models
      - ml_data:/data/ml
      # Bind local: inclui LiDAR seed (data/dem/local/*.tif) — evita OpenTopo na 1ª simulação
      - ./data/dem:/data/dem
      - ./data/3dtiles:/data/3dtiles
      - ./data/citymodels:/data/citymodels
      - ./mapbiomas:/data/mapbiomas
      - ./scripts/s2id_nacional/downloads:/data/s2id_nacional/downloads
      - ./scripts/inmet_bdmep/downloads:/data/inmet_bdmep
      - ./scripts/merge_cptec/downloads:/data/merge_cptec
      - ./scripts/cemaden_pluvio/downloads:/data/cemaden_pluvio
      - ./scripts/ana_hidroweb/downloads:/data/ana_hidroweb
      - ibge_mesh_cache:/data/ibge
      - backups_data:/data/backups
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: ["bash", "./docker-entrypoint.sh"]

  redis:
    image: redis:7-alpine
    container_name: sinidu_redis
    ports:
      - "6379:6379"

  osrm:
    image: osrm/osrm-backend
    container_name: sinidu_osrm
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: []
    ports:
      - "5000:5000"
    environment:
      - OSRM_REGION=${OSRM_REGION:-pe-se}
    volumes:
      - ./docker/osrm:/data
      - ./docker/osrm/docker-entrypoint.sh:/entrypoint.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:5000/route/v1/driving/-34.88,-8.05;-34.87,-8.06?overview=false' | grep -q Ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  gotify:
    image: gotify/server:latest
    container_name: sinidu_gotify
    ports:
      - "8888:80"
    environment:
      - GOTIFY_DEFAULTUSER_PASS=admin
    volumes:
      - gotify_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sinidu_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_HYDRO_MODEL_VERSION=2.3
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  pgdata:
  reports_data:
  models_data:
  ml_data:
  gotify_data:
  backups_data:
  ibge_mesh_cache:
  frontend_node_modules:
  frontend_next:
