# Produção MCID — TLS institucional + auth ligado por padrão
# Uso: ./scripts/prod-up.sh .env
# Substitui docker-compose.proxy-tls.yml em produção (certificados MCID obrigatórios).

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: sinidu_proxy
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    volumes:
      - ./deploy/nginx/nginx-tls.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ${TLS_CERT_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  backend:
    environment:
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - MULTI_TENANT_ENABLED=${MULTI_TENANT_ENABLED:-true}
      - TRUST_PROXY_HEADERS=true
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - OIDC_ENABLED=${OIDC_ENABLED:-true}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - OIDC_FRONTEND_REDIRECT=${OIDC_FRONTEND_REDIRECT}
      - TLS_FULLCHAIN=/etc/nginx/certs/fullchain.pem
    volumes:
      - ${TLS_CERT_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro

  frontend:
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
