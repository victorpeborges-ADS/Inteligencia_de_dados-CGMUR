[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -q
    --tb=short
    --cov=app.data_connectors
    --cov=app.services.maturity_engine
    --cov=app.services.onboarding_engine
    --cov=app.services.postgis_backup
    --cov=app.observability
    --cov-report=term-missing:skip-covered
    --cov-fail-under=60
